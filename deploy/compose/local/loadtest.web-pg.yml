# LOAD TEST ONLY (scripts/loadtest.sh, LT_DB=postgres): layered on
# loadtest.web.yml. Runs Postgres inside the same 2 CPU / 4 GB box as nginx and
# the web app, and points the web app at it. Memory split: nginx 256m + web
# 1024m + Postgres 2816m = 4096 MiB (NGINX_MEM, WEB_MEM, PG_MEM change it; the
# sum must stay 4096). The database has its own container here, so it gets the
# most memory: shared_buffers and the OS page cache for its files.
# LOCAL ONLY credentials.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: library # local only
      POSTGRES_PASSWORD: library # local only
      POSTGRES_DB: library
    # Only the memory settings differ from the defaults: synchronous_commit=on
    # and fsync=on stay, so a commit is durable on power loss. shared_buffers is
    # 25% and effective_cache_size 75% of PG_MEM; the runner derives them (the
    # defaults here are those of the default 2816m).
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-704MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2112MB}
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
    # On disk, not tmpfs: the SQLite file is on disk too. The volume is the
    # parent of PGDATA (as in central.yml).
    volumes: [pgdata:/var/lib/postgresql]
    cpuset: "${NODE_CPUS:-6,7}"
    mem_limit: ${PG_MEM:-2816m}
    memswap_limit: ${PG_MEM:-2816m}
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "library", "-d", "library"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    environment:
      DATABASE_URL: postgres://library:library@postgres:5432/library # local only
    mem_limit: ${WEB_MEM:-1024m}
    memswap_limit: ${WEB_MEM:-1024m}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: {}
