# LOAD TEST ONLY (scripts/loadtest.sh, LT_DB=postgres): layered on
# loadtest.web.yml. Runs Postgres inside the same 2 CPU / 4 GB box as nginx and
# the web app, and points the web app at it. Memory split: nginx 256m + web
# 1024m + Postgres 2816m = 4096 MiB (NGINX_MEM, WEB_MEM, PG_MEM change it; the
# sum must stay 4096). The database has its own container here, so it gets the
# most memory: shared_buffers and the OS page cache for its files.
# LOCAL ONLY credentials.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: library # local only
      POSTGRES_PASSWORD: library # local only
      POSTGRES_DB: library
    # Memory, planner and WAL settings differ from the defaults; synchronous_commit=on
    # and fsync=on stay, so a commit is durable on power loss. shared_buffers is
    # 25% and effective_cache_size 75% of PG_MEM; the runner derives them (the
    # defaults here are those of the default 2816m). work_mem is PG_WORK_MEM; the runner
    # raises max_connections to the pool (DB_POOL) plus 20 when that would pass 50. The planner and WAL flags
    # are the standard SSD values, as PGTune gives for a 2-CPU web workload
    # (random_page_cost=4 is a hard-disk default: it made the planner Seq Scan
    # 52k rows for a whole-title ILIKE search instead of using the trigram GIN
    # indexes). Autovacuum runs more often (scale factors 0.05) so the
    # visibility map keeps index-only scans cheap under constant updates.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-704MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2112MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=176MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_vacuum_insert_scale_factor=0.05
    # On disk, not tmpfs: the SQLite file is on disk too. The volume is the
    # parent of PGDATA (as in central.yml).
    volumes: [pgdata:/var/lib/postgresql]
    cpuset: "${NODE_CPUS:-6,7}"
    mem_limit: ${PG_MEM:-2816m}
    memswap_limit: ${PG_MEM:-2816m}
    shm_size: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "library", "-d", "library"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  web:
    environment:
      DATABASE_URL: postgres://library:library@postgres:5432/library # local only
    mem_limit: ${WEB_MEM:-1024m}
    memswap_limit: ${WEB_MEM:-1024m}
    depends_on:
      postgres:
        condition: service_healthy

  # Background jobs: `COMPOSE_PROFILES=jobs JOBS_ENABLED=true JOBS_SMTP_URL=smtp://mailpit:1025`.
  # For functional checks (the contract test with jobs on); its memory is outside
  # the box's 4096 MiB split, so measured rounds leave the profile off.
  worker:
    profiles: [jobs]
    image: ${WEB_IMAGE:-sqlite-production/web:lt}
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://library:library@postgres:5432/library # local only
      JOBS_ENABLED: "true"
      JOBS_SMTP_URL: ${JOBS_SMTP_URL:-}
      JOBS_METRICS_ADDR: 0.0.0.0:9300
      RUST_LOG: info
    cpuset: "${NODE_CPUS:-6,7}"
    mem_limit: 256m
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9300/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    profiles: [jobs]
    image: axllent/mailpit:v1.31.2
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata: {}
