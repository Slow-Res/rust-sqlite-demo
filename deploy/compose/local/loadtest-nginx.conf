# LOAD TEST ONLY (loadtest.web.yml): nginx in front of the web app, the shape of
# a real single-box deployment (nginx -> app -> database). Mounted over
# /etc/nginx/nginx.conf.
user nginx;
# Explicit: `auto` would count the host's 16 CPUs, not the 2 cores the box has.
worker_processes 2;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Buffered to a file inside the container, not stdout: the image links that to
  # docker logs, and dockerd would then do the logging work outside the box.
  # The runner counts the lines to prove the load went through nginx. The
  # container's own health check (wget) is left out so it does not count.
  map $http_user_agent $loggable {
    ~^Wget 0;
    default 1;
  }
  access_log /var/log/nginx/lt-access.log combined buffer=64k flush=5s if=$loggable;

  # Keep-alive connections to the app, so a request does not pay a TCP connect.
  upstream web {
    server web:4000;
    keepalive 64;
  }

  # Upstream keep-alive needs HTTP/1.1 and no "Connection: close" header.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  client_max_body_size 1m;

  # Cheap compression of the big JSON lists (level 1 costs the least CPU).
  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;
  gzip_comp_level 1;

  server {
    listen 80;
    location / {
      proxy_pass http://web;
    }
  }
}
