# LOAD TEST ONLY (scripts/loadtest.sh, LT_MODE=web, the default): nginx in front
# of the web app, with the SQLite database inside it, on one 2 CPU / 4 GB box.
# No Litestream, sync worker, restore gate, Garage or Prometheus. With
# LT_DB=postgres, loadtest.web-pg.yml is layered on top and adds Postgres to
# the same box.
# Standalone: it does not use node.yml. The service and its settings are the
# web service of node.yml with the values of local/node1.env, minus every
# POSTGRES_* and LITESTREAM_* variable. No ports are published; k6 joins the
# project's default network (and reaches nginx there) and the runner reaches web
# through its container IP.
#
# The restore service of node.yml is not needed: the image's /data is owned by
# the app user (uid 10001), and a new named volume copies that ownership, so web
# creates and migrates an empty library.db itself.
services:
  nginx:
    image: nginx:1.28.0-alpine
    volumes: [./loadtest-nginx.conf:/etc/nginx/nginx.conf:ro]
    # The same cores as web: it is one box, so nginx competes with the app for
    # CPU as it would in a deployment. The memory limits (nginx, web and, with
    # LT_DB=postgres, Postgres) must add up to the box's 4096 MiB: scripts/loadtest.sh
    # up refuses to start otherwise. NGINX_MEM, WEB_MEM and PG_MEM change the split.
    cpuset: "${NODE_CPUS:-6,7}"
    mem_limit: ${NGINX_MEM:-256m}
    memswap_limit: ${NGINX_MEM:-256m}
    # One fd per client connection plus one per upstream request; Docker's
    # default soft limit of 1024 capped the box at about 2,100 users.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-sqlite-production/web:lt}
    environment:
      NODE_ID: node1
      COOKIE_SECURE: "false"
      SESSION_TTL_HOURS: "168"
      RUST_LOG: info
      # No Litestream here, and constant readers keep SQLite's own checkpoints
      # from ever resetting the WAL (2.5 GB for a 43 MB database): truncate it every second.
      SQLITE_CHECKPOINT_INTERVAL_MS: "1000"
    volumes: [data:/data]
    # The same 2 cores (4.4 GHz efficiency cores) as the whole node of the
    # full-node mode; 4096 MiB minus nginx's 256. It holds the app, the SQLite
    # file and the OS page cache of that file, so it gets nearly all of it.
    # memswap_limit equals mem_limit, so no swap.
    cpuset: "${NODE_CPUS:-6,7}"
    mem_limit: ${WEB_MEM:-3840m}
    memswap_limit: ${WEB_MEM:-3840m}
    # Many connections from nginx, plus the database files and sockets.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  data: {}
