# Unit tests for alerts.yml: `make alerts-test` (promtool test rules).
# One sample per minute. In every LitestreamStalled case the txid and PUT
# series carry the labels Prometheus gives a real scrape.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # One write in a quiet hour, S3 down: the PUT counter never moves.
  - name: stalled, quiet node with one write while S3 is down
    interval: 1m
    input_series:
      - series: 'litestream_txid{instance="n1:9090", db="/data/library.db"}'
        values: "100x70 101x40"
      - series: 'litestream_replica_operation_total{instance="n1:9090", operation="PUT"}'
        values: "50x110"
    alert_rule_test:
      - eval_time: 70m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: LitestreamStalled
        exp_alerts:
          - exp_labels:
              instance: "n1:9090"
              db: /data/library.db
            exp_annotations:
              summary: "n1:9090: Litestream stopped uploading to S3 while the database keeps changing"
              runbook: "docs/RUNBOOK.md#s3-down"

  # The same write, but S3 took the upload.
  - name: stalled, silent on a quiet healthy node
    interval: 1m
    input_series:
      - series: 'litestream_txid{instance="n1:9090", db="/data/library.db"}'
        values: "100x70 101x40"
      - series: 'litestream_replica_operation_total{instance="n1:9090", operation="PUT"}'
        values: "50x70 51x40"
    alert_rule_test:
      - eval_time: 76m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: LitestreamStalled
        exp_alerts: []

  # Litestream starts: txid is 0, then jumps to the current value. No write
  # happened and the PUT counter has no series yet.
  - name: stalled, silent on an idle node just after start
    interval: 1m
    input_series:
      - series: 'litestream_txid{instance="n1:9090", db="/data/library.db"}'
        values: "0 0 0 500x120"
    alert_rule_test:
      - eval_time: 10m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 40m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 90m
        alertname: LitestreamStalled
        exp_alerts: []

  # Litestream restarted at minute 31 while S3 was down, so its PUT counter
  # has no series. A write at minute 74 (after the start-up window left the
  # 30m range) must alert.
  - name: stalled, restart during an outage then a write
    interval: 1m
    input_series:
      - series: 'litestream_txid{instance="n1:9090", db="/data/library.db"}'
        values: "500x30 0x1 520x40 521x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 70m
        alertname: LitestreamStalled
        exp_alerts: []
      - eval_time: 85m
        alertname: LitestreamStalled
        exp_alerts:
          - exp_labels:
              instance: "n1:9090"
              db: /data/library.db
            exp_annotations:
              summary: "n1:9090: Litestream stopped uploading to S3 while the database keeps changing"
              runbook: "docs/RUNBOOK.md#s3-down"

  # time() is the eval time in seconds: 1800 s here, 5400 s in the last case.
  - name: resync, fires while the gauge is recent
    interval: 1m
    input_series:
      - series: 'sync_last_resync_timestamp_seconds{instance="n1:9100"}'
        values: "1000x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncResync
        exp_alerts:
          - exp_labels:
              instance: "n1:9100"
            exp_annotations:
              summary: "n1:9100 was restored from an older backup and may have lost writes; check sync_archive"
              runbook: "docs/RUNBOOK.md#after-a-resync"

  - name: resync, silent while the gauge is 0
    interval: 1m
    input_series:
      - series: 'sync_last_resync_timestamp_seconds{instance="n1:9100"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: SyncResync
        exp_alerts: []

  - name: resync, silent once the resync is over an hour old
    interval: 1m
    input_series:
      - series: 'sync_last_resync_timestamp_seconds{instance="n1:9100"}'
        values: "1000x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: SyncResync
        exp_alerts: []

  - name: jobs, a stalled queue fires and a busy but moving one does not
    interval: 1m
    input_series:
      - series: 'jobs_oldest_available_seconds{instance="w1:9300", queue="email"}'
        values: "0+60x20"
      - series: 'jobs_oldest_available_seconds{instance="w1:9300", queue="webhooks"}'
        values: "30x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: JobsQueueStalled
        exp_alerts: []
      - eval_time: 16m
        alertname: JobsQueueStalled
        exp_alerts:
          - exp_labels:
              queue: email
            exp_annotations:
              summary: "jobs queue email: the oldest ready job has waited 16m 0s"
              runbook: "docs/RUNBOOK.md#jobs-a-queue-is-not-moving"

  - name: jobs, a failure fires once and clears
    interval: 1m
    input_series:
      - series: 'jobs_completed_total{instance="w1:9300", kind="webhook.v1", outcome="failed"}'
        values: "0x5 1x30"
      - series: 'jobs_completed_total{instance="w1:9300", kind="loan_email.v1", outcome="succeeded"}'
        values: "0+5x35"
    alert_rule_test:
      - eval_time: 4m
        alertname: JobsFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: JobsFailing
        exp_alerts:
          - exp_labels:
              kind: webhook.v1
            exp_annotations:
              summary: "jobs of kind webhook.v1 failed in the last 15 minutes"
              runbook: "docs/RUNBOOK.md#jobs-failed-jobs"
      - eval_time: 30m
        alertname: JobsFailing
        exp_alerts: []

  - name: jobs, a poison job only the leader's gauge sees fires JobsFailing
    interval: 1m
    input_series:
      # No jobs_completed_total at all: the reaper failed these jobs, no worker did.
      # A kind whose gauge series appears (the gauge has none without failures).
      - series: 'jobs_failed_recent{instance="w1:9300", kind="webhook.v1"}'
        values: "_x20 1x30"
      # A kind whose gauge rises.
      - series: 'jobs_failed_recent{instance="w1:9300", kind="loan_email.v1"}'
        values: "2x20 3x30"
      # Flat, and falling (old failures ageing out of the 24 h window): never an alert.
      - series: 'jobs_failed_recent{instance="w1:9300", kind="flat.v1"}'
        values: "4x50"
      - series: 'jobs_failed_recent{instance="w1:9300", kind="falling.v1"}'
        values: "5x20 4x30"
    alert_rule_test:
      - eval_time: 19m
        alertname: JobsFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: JobsFailing
        exp_alerts:
          - exp_labels:
              kind: loan_email.v1
            exp_annotations:
              summary: "jobs of kind loan_email.v1 failed in the last 15 minutes"
              runbook: "docs/RUNBOOK.md#jobs-failed-jobs"
          - exp_labels:
              kind: webhook.v1
            exp_annotations:
              summary: "jobs of kind webhook.v1 failed in the last 15 minutes"
              runbook: "docs/RUNBOOK.md#jobs-failed-jobs"
      - eval_time: 45m
        alertname: JobsFailing
        exp_alerts: []

  - name: jobs, no leader among scraped workers
    interval: 1m
    input_series:
      - series: 'jobs_leader{instance="w1:9300"}'
        values: "1x5 0x10"
      - series: 'jobs_leader{instance="w2:9300"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: JobsNoLeader
        exp_alerts: []
      - eval_time: 12m
        alertname: JobsNoLeader
        exp_alerts:
          - exp_annotations:
              summary: "no jobs worker is the maintenance leader"
              runbook: "docs/RUNBOOK.md#jobs-a-queue-is-not-moving"

  - name: jobs, a worker that stops answering its scrape fires JobsWorkerDown
    interval: 1m
    input_series:
      - series: 'up{job="jobs-worker", instance="w1:9300"}'
        values: "1x5 0x10"
      - series: 'up{job="jobs-worker", instance="w2:9300"}'
        values: "1x15"
      # Another job's target being down is not this alert's business.
      - series: 'up{job="sync-worker", instance="node1-worker:9100"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 5m
        alertname: JobsWorkerDown
        exp_alerts: []
      - eval_time: 7m
        alertname: JobsWorkerDown
        exp_alerts: []
      - eval_time: 12m
        alertname: JobsWorkerDown
        exp_alerts:
          - exp_labels:
              job: jobs-worker
              instance: "w1:9300"
            exp_annotations:
              summary: "w1:9300: the jobs worker does not answer its metrics scrape"
              runbook: "docs/RUNBOOK.md#jobs-a-queue-is-not-moving"

  - name: jobs, a lost lease fires JobsLeaseLost once and clears
    interval: 1m
    input_series:
      - series: 'jobs_lease_lost_total{instance="w1:9300"}'
        values: "0x5 1x30"
      - series: 'jobs_fence_rejected_total{instance="w1:9300"}'
        values: "0x35"
      - series: 'jobs_lease_lost_total{instance="w2:9300"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 4m
        alertname: JobsLeaseLost
        exp_alerts: []
      - eval_time: 10m
        alertname: JobsLeaseLost
        exp_alerts:
          - exp_labels:
              instance: "w1:9300"
            exp_annotations:
              summary: "w1:9300: a jobs worker lost a lease in the last 15 minutes; a job may have run twice"
              runbook: "docs/RUNBOOK.md#jobs-a-lease-was-lost"
      - eval_time: 30m
        alertname: JobsLeaseLost
        exp_alerts: []

  - name: jobs, a rejected outcome write fires JobsLeaseLost too
    interval: 1m
    input_series:
      - series: 'jobs_fence_rejected_total{instance="w2:9300"}'
        values: "0x5 2x30"
      - series: 'jobs_lease_lost_total{instance="w2:9300"}'
        values: "0x35"
    alert_rule_test:
      - eval_time: 4m
        alertname: JobsLeaseLost
        exp_alerts: []
      - eval_time: 10m
        alertname: JobsLeaseLost
        exp_alerts:
          - exp_labels:
              instance: "w2:9300"
            exp_annotations:
              summary: "w2:9300: a jobs worker lost a lease in the last 15 minutes; a job may have run twice"
              runbook: "docs/RUNBOOK.md#jobs-a-lease-was-lost"
