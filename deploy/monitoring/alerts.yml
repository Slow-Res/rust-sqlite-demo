# Alert rules (spec §8). There is no Alertmanager in the local cluster: see
# firing alerts at http://127.0.0.1:9090/alerts. Each rule names the RUNBOOK
# section to follow.
groups:
  - name: sqlite-production
    rules:
      - alert: SyncLagHigh
        expr: sync_lag_seconds > 60
        for: 5m
        annotations:
          summary: "{{ $labels.instance }}: Postgres is {{ $value | humanizeDuration }} behind this node"
          runbook: "docs/RUNBOOK.md#postgres-down"
      # The worker sets the gauge when it detects a resync, so this does not
      # depend on Prometheus having scraped the counter before it changed.
      - alert: SyncResync
        expr: sync_last_resync_timestamp_seconds > 0 and time() - sync_last_resync_timestamp_seconds < 3600
        annotations:
          summary: "{{ $labels.instance }} was restored from an older backup and may have lost writes; check sync_archive"
          runbook: "docs/RUNBOOK.md#after-a-resync"
      - alert: SyncWorkerDown
        expr: up{job="sync-worker"} == 0
        for: 2m
        annotations:
          summary: "{{ $labels.instance }}: sync-worker is down; Postgres is not receiving changes"
          runbook: "docs/RUNBOOK.md#postgres-down"
      - alert: LitestreamDown
        expr: up{job="litestream"} == 0
        for: 2m
        annotations:
          summary: "{{ $labels.instance }}: Litestream is down; the S3 backup has stopped"
          runbook: "docs/RUNBOOK.md#s3-down"
      # A stalled replica: the database got new transactions in the last 30
      # minutes but S3 took no upload. The PUT counter counts only successful
      # uploads, has no db label (match on instance), and has no series at all
      # until its first success, so a Litestream that restarted during an outage
      # has none: `unless` keeps the node in that case too. The 30m window is
      # why a quiet node (a few writes an hour) is still caught.
      # litestream_txid jumps from 0 to the current value when Litestream
      # starts. `min_over_time(...) > 0` drops every window that holds a 0
      # sample, so that jump never counts as a write. (process_start_time_seconds
      # exists too; this needs no extra series.) deploy/monitoring/alerts.test.yml
      # tests the cases.
      - alert: LitestreamStalled
        expr: >-
          (
            changes(litestream_txid[30m]) > 0
            and on (instance) min_over_time(litestream_txid[30m]) > 0
          )
          unless on (instance)
          increase(litestream_replica_operation_total{operation="PUT"}[30m]) > 0
        for: 5m
        annotations:
          summary: "{{ $labels.instance }}: Litestream stopped uploading to S3 while the database keeps changing"
          runbook: "docs/RUNBOOK.md#s3-down"
      - alert: WalTooLarge
        expr: litestream_wal_size > 256 * 1024 * 1024
        for: 15m
        annotations:
          summary: "{{ $labels.instance }}: the SQLite WAL is {{ $value | humanize1024 }}B; checkpoints are blocked and the disk may fill"
          runbook: "docs/RUNBOOK.md#disk-filling-up"
      # Background jobs (Postgres deployments; docs/JOBS.md). The queue gauges come
      # from the leader only, so `max by (queue)` merges the workers' scrapes.
      - alert: JobsQueueStalled
        expr: max by (queue) (jobs_oldest_available_seconds) > 300
        for: 10m
        annotations:
          summary: "jobs queue {{ $labels.queue }}: the oldest ready job has waited {{ $value | humanizeDuration }}"
          runbook: "docs/RUNBOOK.md#jobs-a-queue-is-not-moving"
      - alert: JobsFailing
        expr: sum by (kind) (increase(jobs_completed_total{outcome="failed"}[15m])) > 0
        annotations:
          summary: "jobs of kind {{ $labels.kind }} failed in the last 15 minutes"
          runbook: "docs/RUNBOOK.md#jobs-failed-jobs"
      # Workers are scraped but none holds the leader lock: nothing reaps
      # crashed jobs or deletes old ones.
      - alert: JobsNoLeader
        expr: count(jobs_leader) > 0 and max(jobs_leader) == 0
        for: 5m
        annotations:
          summary: "no jobs worker is the maintenance leader"
          runbook: "docs/RUNBOOK.md#jobs-a-queue-is-not-moving"
