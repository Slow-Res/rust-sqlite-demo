[package]
name = "library-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "library_jobs"
path = "src/lib.rs"

[dependencies]
sqlx = { workspace = true, features = ["postgres", "migrate", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rand.workspace = true
thiserror = "2"
anyhow = "1"
tracing = "0.1"
prometheus-client = "0.25"
# Only for the optional /metrics /healthz /readyz router (spec §23).
axum = { version = "0.8", optional = true }

[features]
default = ["http"]
http = ["dep:axum"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing-subscriber = "0.3"
# `#[derive(FromRef)]` in the axum tests and the example. The crate itself does not use it.
axum = { version = "0.8", features = ["macros"] }

[[example]]
name = "axum_app"
required-features = ["http"]

[lints]
workspace = true
